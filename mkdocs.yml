site_name: Docker 컨테이너 실습 (8시간)
site_description: Docker & 컨테이너 8시간 실습 · 학생용 가이드
site_author: Skilleat
site_url: https://skilleat-labs.github.io/docker-cotainer-for-8hours/

repo_url: https://github.com/skilleat-labs/docker-cotainer-for-8hours
repo_name: docker-cotainer-for-8hours

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang:
        - ko
        - en

# 숨김(draft) 목록 — 여기 있는 파일은 배포 사이트에서 제외(학생 접근 시 404).
