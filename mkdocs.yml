      - "1-1. VM 직접 체험 (VirtualBox)": day1/01-vm-virtualbox.md
      - "1-2. Docker 기본 명령어와 동작 원리": day1/02-container.md
      - "1-3. 컨테이너는 프로세스다 & 복습 과제": day1/03-container-practice.md
      - "1-4. 프라이빗 레지스트리 실습 (ECR)": day1/04-ecr-registry.md
      - "1-5. [과제] 내 이미지 ECR에 push": day1/05-ecr-push-challenge.md
      - "1-6. Dockerfile로 나만의 이미지 만들기": day1/06-dockerfile.md
      - "1-6-1. [도전과제] 나만의 앱 이미지 만들기": day1/06-1-challenge.md
      - "1-7. 멀티스테이지 빌드": day1/07-multistage.md
      - "1-8. Docker 볼륨 — 데이터 지키기": day1/08-volume.md
      - "1-9. Docker 네트워크": day1/09-network.md
      - "1-9-1. [도전과제] 미니 블로그 (docker 명령)": day1/09-1-challenge.md
      - "1-10. Docker Compose 맛보기": day1/10-compose-intro.md
      - "1-11. Compose로 웹 도구 + DB 띄우기": day1/11-compose-db.md
      # ── 아래는 현재 '숨김' 상태. 공개할 때 주석(#) 해제 + 위 draft_docs에서 같은 파일 삭제 ──
      # - "1-12. [도전과제] 미니 블로그 완성하기": day1/12-compose-challenge.md
